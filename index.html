<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0a0a0a">
  <title>FOGÓN — Acceso</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #090909;
      --panel: #141414;
      --line: #303030;
      --text: #f5f1e8;
      --muted: #aaa59c;
      --accent: #d7c39a;
      --danger: #ff8a80;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      background:
        radial-gradient(circle at top, #23201b 0, var(--bg) 38%),
        var(--bg);
      color: var(--text);
    }

    main {
      width: min(720px, calc(100% - 32px));
      margin: 0 auto;
      padding: 56px 0;
    }

    .brand {
      margin-bottom: 32px;
      letter-spacing: .18em;
      text-transform: uppercase;
    }

    .brand h1 {
      margin: 0;
      font-size: clamp(28px, 7vw, 52px);
      line-height: .95;
    }

    .brand p {
      margin: 12px 0 0;
      color: var(--muted);
      letter-spacing: .08em;
    }

    .panel {
      padding: 24px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: rgba(20, 20, 20, .94);
      box-shadow: 0 24px 80px rgba(0, 0, 0, .4);
    }

    label {
      display: block;
      margin-bottom: 10px;
      color: var(--muted);
      font-size: 14px;
    }

    .password-row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
    }

    input, button {
      min-height: 48px;
      border-radius: 10px;
      font: inherit;
    }

    input {
      width: 100%;
      padding: 0 14px;
      border: 1px solid var(--line);
      outline: none;
      background: #080808;
      color: var(--text);
    }

    input:focus { border-color: var(--accent); }

    button {
      padding: 0 20px;
      border: 0;
      background: var(--accent);
      color: #15120d;
      font-weight: 800;
      cursor: pointer;
    }

    button:hover { filter: brightness(1.08); }

    .error {
      min-height: 20px;
      margin: 12px 0 0;
      color: var(--danger);
      font-size: 13px;
    }

    @media (max-width: 520px) {
      main { padding: 36px 0; }
      .password-row { grid-template-columns: 1fr; }
      button { width: 100%; }
    }
  </style>
</head>
<body>
  <main>
    <header class="brand">
      <h1>FOGÓN</h1>
      <p>Cancionero - voz + guitarra</p>
    </header>

    <section class="panel" aria-labelledby="login-title">
      <h2 id="login-title">Acceso</h2>
      <form id="login-form">
        <label for="password">Ingresá la clave del cancionero</label>
        <div class="password-row">
          <input
            id="password"
            name="password"
            type="password"
            inputmode="numeric"
            autocomplete="off"
            autofocus
            required
          >
          <button type="submit">Entrar</button>
        </div>
        <p id="error" class="error" role="alert" aria-live="polite"></p>
      </form>
    </section>
  </main>

  <script>
    const ACCESS_CODE = "1256";
    const SONGBOOK_PATH = "cancionero-coke-7f3a.html";
    const form = document.querySelector("#login-form");
    const password = document.querySelector("#password");
    const error = document.querySelector("#error");

    form.addEventListener("submit", (event) => {
      event.preventDefault();

      if (password.value === ACCESS_CODE) {
        window.location.replace(SONGBOOK_PATH);
        return;
      }

      error.textContent = "Clave incorrecta.";
      password.select();
    });
  </script>
</body>
</html>
